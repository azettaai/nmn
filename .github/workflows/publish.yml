name: Publish Python 🐍 distribution to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Package indexes reject the local ``+g<sha>`` suffix produced by hatch-vcs for
# untagged commits. Release uploads therefore run only for version tags. A
# manual workflow dispatch still builds and validates the artifacts without
# publishing an invalid development version.

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so hatch-vcs can read tags

      - name: Verify release tag is contained in master
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build==1.3.0 hatchling==1.27.0 hatch-vcs==0.4.0 twine==6.2.0

      - name: Validate stable release tag and required commit checks
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os; from scripts.verify_release import validate_tag; validate_tag(os.environ["RELEASE_TAG"])'
          python scripts/check_release_ci.py

      - name: Build package once
        run: python -m build --no-isolation

      - name: Verify metadata and archive contents
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m twine check --strict dist/*
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            python scripts/verify_release.py dist --tag "$RELEASE_TAG"
          else
            python scripts/verify_release.py dist
          fi

      - name: Smoke test installed wheel without source or optional backends
        run: |
          python -m venv /tmp/nmn-release-smoke
          /tmp/nmn-release-smoke/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/nmn-release-smoke/bin/python -I -c 'from nmn import *; assert callable(doctor)'
          /tmp/nmn-release-smoke/bin/python -I -m nmn info
          /tmp/nmn-release-smoke/bin/python -I -m nmn doctor

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nmn
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify exact build artifact
        run: |
          python - <<'PYHASH'
          import hashlib, json
          from pathlib import Path
          root = Path("dist")
          manifest = root / "SHA256SUMS.json"
          expected = json.loads(manifest.read_text())
          actual = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p != manifest}
          assert actual == expected, "Distribution digest mismatch"
          manifest.unlink()
          PYHASH

      - name: Publish to TestPyPI (trusted publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: false

  publish-to-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish-to-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/nmn
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify exact build artifact
        run: |
          python - <<'PYHASH'
          import hashlib, json
          from pathlib import Path
          root = Path("dist")
          manifest = root / "SHA256SUMS.json"
          expected = json.loads(manifest.read_text())
          actual = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p != manifest}
          assert actual == expected, "Distribution digest mismatch"
          manifest.unlink()
          PYHASH

      - name: Publish to PyPI (trusted publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: false
